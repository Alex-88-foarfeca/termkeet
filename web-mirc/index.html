<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Poiana lui Iocan — IRC</title>
<meta name="theme-color" content="#0a246a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Poiana IRC" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-512.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<style>
  :root {
    --chrome: #c0c0c0;
    --navy: #0a246a;
    --navy2: #a6caf0;
    --fg: #000000;
    --dim: #555555;
    --accent: #0a246a;   /* self nick */
    --accent2: #7f0000;  /* peer nick */
    --danger: #cc0000;
    --mono: Consolas, "Courier New", monospace;
    --sans: Tahoma, "MS Sans Serif", Geneva, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #808080;
    color: var(--fg);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; justify-content: center; min-height: 100%; }

  .app {
    position: relative;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--chrome);
    border-left: 1px solid #000;
    border-right: 1px solid #000;
  }
  @media (min-width: 680px) { .app { max-width: 720px; } }

  /* ---- title bar ---- */
  .titlebar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: calc(5px + env(safe-area-inset-top)) 6px 5px;
    background: linear-gradient(to right, var(--navy), #3a6ea5 60%, var(--navy2));
    color: #fff;
  }
  .ticon { font-size: 13px; }
  .ttext {
    flex: 1 1 auto;
    min-width: 0;
    font-weight: bold;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nickToggle {
    font-family: var(--sans);
    font-size: 11px;
    background: var(--chrome);
    border: 1px outset #e0e0e0;
    padding: 3px 7px;
    cursor: pointer;
  }
  .nickToggle:active { border-style: inset; }
  .tbtn-close {
    width: 22px;
    height: 20px;
    font-size: 13px;
    background: var(--chrome);
    border: 1px outset #e0e0e0;
    cursor: pointer;
  }
  .tbtn-close:hover { background: #e81123; color: #fff; }
  .tbtn-close:active { border-style: inset; }

  /* ---- menu bar ---- */
  .menubar {
    flex: none;
    display: flex;
    background: var(--chrome);
    border-bottom: 1px solid #808080;
    padding: 2px 2px;
    position: relative;
  }
  .menuitem { padding: 3px 9px; font-size: 11.5px; cursor: default; position: relative; }
  .menuitem:hover { background: var(--navy); color: #fff; }
  .menudrop {
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 150px;
    background: var(--chrome);
    border: 1px outset #e0e0e0;
    box-shadow: 2px 2px 4px rgba(0, 0, 0, .4);
    z-index: 50;
    padding: 2px;
  }
  .menuopt { padding: 5px 12px; font-size: 11.5px; cursor: default; white-space: nowrap; }
  .menuopt:hover { background: var(--navy); color: #fff; }
  .menusep { height: 1px; background: #808080; border-bottom: 1px solid #fff; margin: 3px 2px; }

  /* ---- channel bar ---- */
  .chanbar { flex: none; padding: 4px 6px; background: var(--chrome); }
  .chanbar input {
    width: 100%;
    font-family: var(--mono);
    font-size: 16px;
    padding: 4px 6px;
    border: 1px inset #e0e0e0;
    background: #fff;
    color: #000;
  }

  /* ---- body: chat pane + nicklist ---- */
  .body { flex: 1 1 auto; min-height: 0; display: flex; position: relative; padding: 0 5px 5px; gap: 4px; }
  .chatpane {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border: 1px inset #e0e0e0;
    background: #fff;
  }

  .histhint {
    flex: none;
    padding: 3px 6px;
    font-family: var(--mono);
    font-size: 10px;
    color: #555;
    text-align: center;
    background: #f3f3f3;
    border-bottom: 1px solid #c0c0c0;
  }

  .log {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 6px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.4;
    -webkit-user-select: text;
    user-select: text;
  }
  .line { white-space: pre-wrap; word-break: break-word; }
  .line .ts { color: #888; }
  .line.sys { color: #008000; }
  .line.err { color: #cc0000; }
  .line.hint { color: #555; }
  .line.chat .nick { font-weight: bold; }
  .line.chat.self .nick { color: var(--accent); }
  .line.chat.peer .nick { color: var(--accent2); }

  .controls {
    flex: none;
    border-top: 1px solid #c0c0c0;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #f3f3f3;
  }

  .btn {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: bold;
    color: #000;
    background: var(--chrome);
    border: 1px outset #e0e0e0;
    padding: 8px 12px;
    cursor: pointer;
    text-align: center;
  }
  .btn:active { border-style: inset; }
  .btn.secondary { background: #e8e8e8; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btnrow { display: flex; gap: 6px; }
  .btnrow .btn { flex: 1; }

  .field-label { font-family: var(--sans); font-size: 11px; color: #333; }

  input[type="text"] {
    font-family: var(--mono);
    font-size: 16px; /* >=16px avoids iOS zoom-on-focus */
    color: #000;
    background: #fff;
    border: 1px inset #e0e0e0;
    padding: 7px 8px;
    width: 100%;
    caret-color: #000;
  }
  input[type="text"]::placeholder { color: #888; }
  input[type="text"]:focus { outline: 1px dotted #000; outline-offset: -3px; }

  .chatrow { display: flex; align-items: center; gap: 6px; }
  .chatrow .prompt { font-family: var(--mono); color: var(--navy); font-weight: bold; }
  .chatrow input[type="text"] { flex: 1; }
  .chatrow .send {
    font-family: var(--sans);
    font-weight: bold;
    background: var(--chrome);
    color: #000;
    border: 1px outset #e0e0e0;
    padding: 0 14px;
    height: 38px;
    cursor: pointer;
  }
  .chatrow .send:active { border-style: inset; }
  .chatrow .send:disabled { opacity: .4; }

  /* ---- nicklist ---- */
  .nicklist {
    display: none;
    position: absolute;
    top: 0; right: 5px; bottom: 5px;
    width: 150px;
    background: #fff;
    border: 1px solid #808080;
    flex-direction: column;
    z-index: 15;
    box-shadow: -2px 2px 6px rgba(0, 0, 0, .35);
  }
  .nicklist.nl-open { display: flex; }
  .nickhead {
    flex: none;
    background: var(--chrome);
    border-bottom: 1px solid #808080;
    padding: 3px 6px;
    font-weight: bold;
    font-size: 10.5px;
  }
  .nicks { flex: 1 1 auto; overflow-y: auto; padding: 2px 0; }
  .nick { padding: 3px 7px; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .nick.self { font-weight: bold; }
  @media (min-width: 680px) {
    .nicklist { display: flex; position: static; width: 150px; box-shadow: none; }
    .nickToggle { display: none; }
  }

  .statusbar {
    flex: none;
    padding: 3px 6px calc(3px + env(safe-area-inset-bottom));
    background: var(--chrome);
    border-top: 1px solid #fff;
    box-shadow: inset 0 1px 0 #808080;
    font-size: 10.5px;
    color: #000;
  }
  .statusbar.live { color: #006000; font-weight: bold; }
  .statusbar.err { color: #cc0000; font-weight: bold; }

  /* ---- disconnect dialog ---- */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 30;
    background: rgba(0, 0, 0, .4);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .dialog {
    background: var(--chrome);
    border: 2px outset #e0e0e0;
    box-shadow: 3px 3px 8px rgba(0, 0, 0, .5);
    width: 100%;
    max-width: 280px;
    padding: 14px;
    text-align: center;
    font-family: var(--sans);
  }
  .dg-title { font-weight: bold; font-size: 12px; margin-bottom: 8px; }
  .dg-count { font-size: 36px; font-weight: bold; color: var(--navy); font-variant-numeric: tabular-nums; margin: 4px 0; }
  .dg-count.warn { color: var(--danger); }
  .dg-sub { font-size: 11px; color: #000; line-height: 1.5; margin-bottom: 10px; }
  .dg-btn {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: bold;
    padding: 6px 16px;
    background: var(--chrome);
    border: 1px outset #e0e0e0;
    cursor: pointer;
  }
  .dg-btn:active { border-style: inset; }

  ::-webkit-scrollbar { width: 14px; }
  ::-webkit-scrollbar-thumb { background: var(--chrome); border: 1px solid #808080; }
</style>
</head>
<body>
  <div class="app">
    <div class="titlebar">
      <span class="ticon">💬</span>
      <span class="ttext" id="titleText">Poiana lui Iocan - [neconectat]</span>
      <button class="nickToggle" id="nickToggle" title="Useri">👥 <span id="nickCount">0</span></button>
      <button class="tbtn-close" id="btnClose" title="Închide chat">×</button>
    </div>
    <div class="menubar">
      <div class="menuitem" id="menuFile">
        File
        <div class="menudrop" id="menuFileDrop" hidden>
          <div class="menuopt" id="optKick">Kick user</div>
          <div class="menuopt" id="optTrivia">Trivia</div>
          <div class="menusep"></div>
          <div class="menuopt" id="optClose">Close chat</div>
        </div>
      </div>
    </div>
    <div class="chanbar">
      <input type="text" id="chanBox" readonly value="#poiana-lui-iocan" />
    </div>
    <div class="body">
      <div class="chatpane">
        <div class="histhint" id="histhint" hidden>se păstrează doar ultimele 20 de mesaje</div>
        <div class="log" id="log" aria-live="polite"></div>
        <div class="controls" id="controls"></div>
      </div>
      <div class="nicklist" id="nicklist">
        <div class="nickhead">Useri — <span id="nickHeadCount">0</span></div>
        <div class="nicks" id="nicks"></div>
      </div>
    </div>
    <div class="statusbar" id="statusbar">neconectat</div>
    <div class="overlay" id="overlay" style="display:none"></div>
  </div>

<script>
'use strict'

/*
 * Poiana lui Iocan — mIRC-skin web variant.
 *
 * Same WebRTC P2P core as web/index.html (RTCDataChannel, manual SDP
 * handshake exchanged as a link/code, DTLS-encrypted, nothing stored or
 * server-relayed) — just rendered as a classic mIRC-style window instead
 * of WhatsApp-style bubbles, so it can sit on a phone's Home Screen next
 * to the other skin as a visibly different "app". See web/index.html for
 * the full rationale comments on the WebRTC plumbing itself.
 */

const log = document.getElementById('log')
const controls = document.getElementById('controls')
const histHintEl = document.getElementById('histhint')
const overlayEl = document.getElementById('overlay')
const titleText = document.getElementById('titleText')
const chanBox = document.getElementById('chanBox')
const statusbarEl = document.getElementById('statusbar')
const nicklistEl = document.getElementById('nicklist')
const nicksEl = document.getElementById('nicks')
const nickCountEl = document.getElementById('nickCount')
const nickHeadCountEl = document.getElementById('nickHeadCount')
const menuFile = document.getElementById('menuFile')
const menuFileDrop = document.getElementById('menuFileDrop')

const ICE_SERVERS = [
  {
    urls: [
      'stun:stun.l.google.com:19302',
      'stun:stun1.l.google.com:19302',
      'stun:stun.cloudflare.com:3478'
    ]
  },
  // Public test TURN relay (Open Relay Project / metered.ca) — only used as a
  // fallback when a direct path isn't reachable (e.g. strict carrier NATs).
  // See web/index.html for the full note on this.
  {
    urls: [
      'turn:staticauth.openrelay.metered.ca:80',
      'turn:staticauth.openrelay.metered.ca:443',
      'turn:staticauth.openrelay.metered.ca:443?transport=tcp'
    ],
    username: 'openrelayproject',
    credential: 'openrelayproject'
  }
]

let pc = null
let dc = null
let myName = 'anon'
let peerName = 'peer'
let keepaliveTimer = null
let overlayTimer = null
let everConnected = false

// ---------------- log helpers ----------------

function timestamp () {
  return new Date().toTimeString().slice(0, 5)
}

function esc (s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
}

function addLine (cls, text) {
  const div = document.createElement('div')
  div.className = 'line ' + cls
  div.textContent = text
  log.appendChild(div)
  log.scrollTop = log.scrollHeight
}

const MAX_HISTORY = 20 // keep only the last N chat lines on screen

function addChat (name, text, self) {
  const div = document.createElement('div')
  div.className = 'line chat ' + (self ? 'self' : 'peer')
  div.innerHTML = `<span class="ts">[${timestamp()}]</span> <span class="nick">&lt;${esc(name)}&gt;</span> ${esc(text)}`
  log.appendChild(div)

  const chatLines = log.querySelectorAll('.line.chat')
  for (let i = 0; i < chatLines.length - MAX_HISTORY; i++) chatLines[i].remove()

  log.scrollTop = log.scrollHeight
}

function setStatus (text, kind) {
  statusbarEl.textContent = text
  statusbarEl.className = 'statusbar' + (kind ? ' ' + kind : '')
}

function renderNicks () {
  nicksEl.innerHTML = ''
  const mine = document.createElement('div')
  mine.className = 'nick self'
  mine.textContent = '@' + myName
  nicksEl.appendChild(mine)
  const peerOnline = dc && dc.readyState === 'open'
  if (peerOnline) {
    const peer = document.createElement('div')
    peer.className = 'nick'
    peer.textContent = '@' + peerName
    nicksEl.appendChild(peer)
  }
  const count = peerOnline ? 2 : 1
  nickCountEl.textContent = count
  nickHeadCountEl.textContent = count
}

// ---------------- disconnect dialog ----------------

function hideOverlay () {
  if (overlayTimer) { clearInterval(overlayTimer); overlayTimer = null }
  overlayEl.style.display = 'none'
  overlayEl.innerHTML = ''
}

function showGraceCountdown (seconds) {
  if (overlayTimer) clearInterval(overlayTimer)
  let left = seconds
  overlayEl.style.display = 'flex'
  overlayEl.innerHTML =
    '<div class="dialog"><div class="dg-title">* conexiune instabilă *</div>' +
    '<div class="dg-count" id="ovCount">' + left + '</div>' +
    '<div class="dg-sub">încerc să reiau legătura automat.<br>' +
    'dacă ajunge la 0, creați o cameră nouă.</div></div>'
  const countEl = document.getElementById('ovCount')
  overlayTimer = setInterval(() => {
    left--
    if (countEl) {
      countEl.textContent = left
      if (left <= 10) countEl.classList.add('warn')
    }
    if (left <= 0) {
      clearInterval(overlayTimer)
      overlayTimer = null
      showConnectionLost()
    }
  }, 1000)
}

function showConnectionLost () {
  if (overlayTimer) { clearInterval(overlayTimer); overlayTimer = null }
  stopKeepalive()
  overlayEl.style.display = 'flex'
  overlayEl.innerHTML = ''
  const dialog = document.createElement('div')
  dialog.className = 'dialog'
  const title = document.createElement('div')
  title.className = 'dg-title'
  title.textContent = '* conexiune pierdută *'
  const sub = document.createElement('div')
  sub.className = 'dg-sub'
  sub.textContent = 'legătura cu ' + peerName + ' s-a încheiat. creați o cameră nouă ca să continuați.'
  const btn = document.createElement('button')
  btn.className = 'dg-btn'
  btn.textContent = 'Cameră nouă'
  btn.onclick = () => { location.href = location.origin + location.pathname }
  dialog.append(title, sub, btn)
  overlayEl.appendChild(dialog)
  setStatus('deconectat', 'err')
}

// ---------------- SDP <-> short code ----------------

function toBase64Url (buf) {
  let bin = ''
  const bytes = new Uint8Array(buf)
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i])
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
}

function fromBase64Url (str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/').padEnd(str.length + (4 - str.length % 4) % 4, '=')
  const bin = atob(b64)
  const bytes = new Uint8Array(bin.length)
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
  return bytes.buffer
}

async function packSDP (desc) {
  const json = JSON.stringify({ t: desc.type, s: desc.sdp, n: myName })
  if (typeof CompressionStream === 'function') {
    const cs = new CompressionStream('gzip')
    const writer = cs.writable.getWriter()
    writer.write(new TextEncoder().encode(json))
    writer.close()
    const buf = await new Response(cs.readable).arrayBuffer()
    return 'z' + toBase64Url(buf)
  }
  return 'p' + toBase64Url(new TextEncoder().encode(json).buffer)
}

async function unpackSDP (code) {
  const kind = code[0]
  const buf = fromBase64Url(code.slice(1))
  let json
  if (kind === 'z') {
    const ds = new DecompressionStream('gzip')
    const writer = ds.writable.getWriter()
    writer.write(new Uint8Array(buf))
    writer.close()
    const out = await new Response(ds.readable).arrayBuffer()
    json = new TextDecoder().decode(out)
  } else {
    json = new TextDecoder().decode(buf)
  }
  const obj = JSON.parse(json)
  return { desc: { type: obj.t, sdp: obj.s }, name: (obj.n || 'peer').slice(0, 40) }
}

function extractCode (input, param) {
  const trimmed = input.trim()
  const hashIdx = trimmed.indexOf('#')
  const hash = hashIdx >= 0 ? trimmed.slice(hashIdx + 1) : trimmed
  const params = new URLSearchParams(hash)
  return params.get(param) || trimmed
}

function shareLink (param, code) {
  return location.origin + location.pathname + '#' + param + '=' + code
}

// ---------------- WebRTC plumbing ----------------

function waitIceComplete (peerConn) {
  if (peerConn.iceGatheringState === 'complete') return Promise.resolve()
  return new Promise((resolve) => {
    const done = () => {
      peerConn.removeEventListener('icegatheringstatechange', check)
      clearTimeout(timer)
      resolve()
    }
    const check = () => { if (peerConn.iceGatheringState === 'complete') done() }
    peerConn.addEventListener('icegatheringstatechange', check)
    const timer = setTimeout(done, 8000)
  })
}

function stopKeepalive () {
  if (keepaliveTimer) { clearInterval(keepaliveTimer); keepaliveTimer = null }
}

function startKeepalive () {
  stopKeepalive()
  keepaliveTimer = setInterval(() => {
    if (dc && dc.readyState === 'open') {
      try { dc.send(JSON.stringify({ t: 'ping' })) } catch (_) {}
    }
  }, 15000)
}

function showFatal (err) {
  const detail = (err && (err.message || err.name)) || String(err)
  addLine('err', '[!] ' + detail)
  addLine('hint', '    reîncarcă pagina și încearcă din nou.')
  setStatus('eroare', 'err')
  console.error(err)
}

function withWatchdog (label, promise, ms) {
  let timer
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(label + ' durează prea mult — browserul ar putea bloca WebRTC aici.')), ms)
  })
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer))
}

window.addEventListener('unhandledrejection', (e) => { showFatal(e.reason) })

function createPeerConnection () {
  if (typeof RTCPeerConnection !== 'function') {
    throw new Error('acest browser nu suportă WebRTC (RTCPeerConnection lipsește).')
  }
  const conn = new RTCPeerConnection({ iceServers: ICE_SERVERS })
  const GRACE_SECONDS = 15

  conn.onconnectionstatechange = () => {
    const s = conn.connectionState
    if (s === 'connected') {
      hideOverlay()
      if (dc && dc.readyState === 'open') setStatus('conectat cu ' + peerName, 'live')
    } else if (s === 'disconnected') {
      if (!everConnected) return
      setStatus('conexiune instabilă…', 'err')
      showGraceCountdown(GRACE_SECONDS)
    } else if (s === 'failed') {
      stopKeepalive()
      if (everConnected) {
        showConnectionLost()
      } else {
        addLine('err', '[!] nu s-a putut stabili conexiunea — reîncărcați pagina și încercați din nou.')
        setStatus('eroare', 'err')
      }
    }
  }
  return conn
}

function wireDataChannel (channel) {
  dc = channel
  dc.onopen = () => {
    everConnected = true
    hideOverlay()
    setStatus('conectat cu ' + peerName, 'live')
    addLine('sys', '[*] conexiune P2P deschisă — mesajele merg direct între voi, criptat.')
    renderNicks()
    startKeepalive()
    renderChat()
  }
  dc.onclose = () => {
    stopKeepalive()
    addLine('sys', '[*] conversația s-a încheiat (' + peerName + ' a plecat).')
    if (everConnected) showConnectionLost()
    else setStatus('deconectat', 'err')
  }
  dc.onmessage = (e) => {
    let msg
    try { msg = JSON.parse(e.data) } catch (_) { return }
    if (msg && (msg.t === 'ping' || msg.t === 'pong')) {
      if (msg.t === 'ping' && dc.readyState === 'open') {
        try { dc.send(JSON.stringify({ t: 'pong' })) } catch (_) {}
      }
      return
    }
    addChat(String(msg.name || peerName).slice(0, 40), String(msg.text || '').slice(0, 4000), false)
  }
}

// ---------------- flows ----------------

function clearControls () { controls.innerHTML = '' }

function landing () {
  clearControls()
  const create = document.createElement('button')
  create.className = 'btn'
  create.textContent = 'Creează o cameră nouă'
  create.onclick = () => askNameThen(startCreate)

  const or = document.createElement('div')
  or.className = 'field-label'
  or.style.textAlign = 'center'
  or.textContent = 'sau'

  const joinInput = document.createElement('input')
  joinInput.type = 'text'
  joinInput.placeholder = 'lipește aici linkul / codul primit'
  joinInput.autocomplete = 'off'
  joinInput.autocapitalize = 'off'

  const join = document.createElement('button')
  join.className = 'btn secondary'
  join.textContent = 'Alătură-te'
  join.onclick = () => {
    const code = extractCode(joinInput.value, 'o')
    if (!code) return
    askNameThen((name) => startJoin(code, name))
  }

  controls.append(create, or, joinInput, join)
}

function askNameThen (next) {
  clearControls()
  const label = document.createElement('div')
  label.className = 'field-label'
  label.textContent = 'numele tău (îl vede celălalt)'
  const input = document.createElement('input')
  input.type = 'text'
  input.placeholder = 'ex: Alex'
  input.maxLength = 40
  input.autocomplete = 'off'
  const go = document.createElement('button')
  go.className = 'btn'
  go.textContent = 'Continuă'
  go.onclick = () => {
    myName = (input.value.trim() || 'anon').slice(0, 40)
    renderNicks()
    Promise.resolve(next(myName)).catch(showFatal)
  }
  controls.append(label, input, go)
  input.focus()
}

async function startCreate () {
  clearControls()
  addLine('sys', '[*] pregătesc camera...')
  setStatus('se pregătește...')

  const link = await withWatchdog('crearea camerei', (async () => {
    pc = createPeerConnection()
    const channel = pc.createDataChannel('chat')
    wireDataChannel(channel)

    const offer = await pc.createOffer()
    await pc.setLocalDescription(offer)
    await waitIceComplete(pc)

    const code = await packSDP(pc.localDescription)
    return shareLink('o', code)
  })(), 20000)

  chanBox.value = '#poiana-' + link.slice(-8)
  titleText.textContent = 'Poiana lui Iocan - [' + chanBox.value + ']'
  addLine('sys', '[*] cameră creată. trimite link-ul de mai jos prietenului tău:')
  renderShare(link, 'Trimite invitația', async () => {
    clearControls()
    const label = document.createElement('div')
    label.className = 'field-label'
    label.textContent = 'după ce prietenul tău îți trimite înapoi codul lui de răspuns, lipește-l aici:'
    const input = document.createElement('input')
    input.type = 'text'
    input.placeholder = 'cod de răspuns'
    input.autocomplete = 'off'
    input.autocapitalize = 'off'
    const go = document.createElement('button')
    go.className = 'btn'
    go.textContent = 'Conectează'
    go.onclick = async () => {
      const answerCode = extractCode(input.value, 'a')
      if (!answerCode) return
      go.disabled = true
      try {
        const { desc, name } = await unpackSDP(answerCode)
        peerName = name
        await pc.setRemoteDescription(desc)
        addLine('sys', '[*] se stabilește conexiunea directă...')
        setStatus('se conectează...')
      } catch (err) {
        addLine('err', '[!] cod invalid: ' + ((err && err.message) || err))
        go.disabled = false
      }
    }
    controls.append(label, input, go)
  }, link)
}

async function startJoin (offerCode, name) {
  clearControls()
  addLine('sys', '[*] mă alătur camerei...')
  setStatus('se pregătește...')
  myName = name

  let offer
  try {
    offer = await unpackSDP(offerCode)
  } catch (err) {
    addLine('err', '[!] linkul/codul nu e valid.')
    landing()
    return
  }
  peerName = offer.name
  chanBox.value = '#poiana-' + offerCode.slice(-8)
  titleText.textContent = 'Poiana lui Iocan - [' + chanBox.value + ']'

  const code = await withWatchdog('conectarea la cameră', (async () => {
    pc = createPeerConnection()
    pc.ondatachannel = (e) => wireDataChannel(e.channel)

    await pc.setRemoteDescription(offer.desc)
    const answer = await pc.createAnswer()
    await pc.setLocalDescription(answer)
    await waitIceComplete(pc)

    return packSDP(pc.localDescription)
  })(), 20000)

  addLine('sys', '[*] trimite codul de mai jos înapoi lui ' + peerName + ' ca să terminați conectarea:')
  renderShare(null, 'Trimite codul de răspuns', null, code, 'Poiana lui Iocan — cod de răspuns:\n' + code + '\n\n(lipește-l în ecranul unde a fost creată camera)')
  addLine('hint', '    aștept ca ' + peerName + ' să finalizeze conectarea...')
  setStatus('în așteptare...')
}

function renderShare (link, shareLabel, onManualNext, rawForCopy, shareTextOverride) {
  const box = document.createElement('input')
  box.type = 'text'
  box.readOnly = true
  box.value = link || rawForCopy
  box.onclick = () => box.select()

  const row = document.createElement('div')
  row.className = 'btnrow'

  const copyBtn = document.createElement('button')
  copyBtn.className = 'btn secondary'
  copyBtn.textContent = 'Copiază'
  copyBtn.onclick = async () => {
    const text = link || rawForCopy
    try {
      await navigator.clipboard.writeText(text)
      copyBtn.textContent = 'Copiat ✓'
      setTimeout(() => { copyBtn.textContent = 'Copiază' }, 1500)
    } catch (_) {
      box.select()
      document.execCommand('copy')
    }
  }

  const shareBtn = document.createElement('button')
  shareBtn.className = 'btn'
  shareBtn.textContent = shareLabel
  shareBtn.onclick = async () => {
    const text = shareTextOverride || ('Poiana lui Iocan — invitație la chat: ' + link)
    try {
      if (navigator.share) {
        await navigator.share(link ? { title: 'Poiana lui Iocan', text: 'Poiana lui Iocan — invitație la chat', url: link } : { title: 'Poiana lui Iocan', text })
      } else {
        await navigator.clipboard.writeText(text)
        shareBtn.textContent = 'Copiat ✓ (lipește-l în orice app)'
        setTimeout(() => { shareBtn.textContent = shareLabel }, 2000)
      }
    } catch (_) {}
  }

  row.append(shareBtn, copyBtn)
  controls.append(box, row)

  if (onManualNext) {
    const nextBtn = document.createElement('button')
    nextBtn.className = 'btn secondary'
    nextBtn.textContent = 'Am trimis-o →'
    nextBtn.onclick = onManualNext
    controls.append(nextBtn)
  }
}

function renderChat () {
  clearControls()
  histHintEl.textContent = 'se păstrează doar ultimele ' + MAX_HISTORY + ' de mesaje'
  histHintEl.hidden = false
  const row = document.createElement('div')
  row.className = 'chatrow'

  const prompt = document.createElement('span')
  prompt.className = 'prompt'
  prompt.textContent = '>'

  const input = document.createElement('input')
  input.type = 'text'
  input.placeholder = 'scrie un mesaj...'
  input.autocomplete = 'off'
  input.maxLength = 2000

  const send = document.createElement('button')
  send.className = 'send'
  send.textContent = 'Trimite'

  function submit () {
    const text = input.value.trim()
    if (!text || !dc || dc.readyState !== 'open') return
    dc.send(JSON.stringify({ name: myName, text }))
    addChat(myName, text, true)
    input.value = ''
  }

  send.onclick = submit
  input.onkeydown = (e) => { if (e.key === 'Enter') submit() }

  row.append(prompt, input, send)
  controls.appendChild(row)
  input.focus()
}

// ---------------- File menu / nicklist toggle / kick / close ----------------

function kickPeer () {
  if (!(dc && dc.readyState === 'open')) return
  addLine('sys', '[*] ai dat kick celuilalt participant.')
  try { dc.close() } catch (_) {}
  try { pc && pc.close() } catch (_) {}
  showConnectionLost()
}

function endChatAndLeave () {
  try { pc && pc.close() } catch (_) {}
  location.href = location.origin + location.pathname
}

menuFile.addEventListener('click', (e) => {
  e.stopPropagation()
  menuFileDrop.hidden = !menuFileDrop.hidden
})
document.addEventListener('click', () => { menuFileDrop.hidden = true })

document.getElementById('optKick').onclick = () => { menuFileDrop.hidden = true; kickPeer() }
document.getElementById('optTrivia').onclick = () => {
  menuFileDrop.hidden = true
  addLine('sys', '[*] Trivia — în lucru, revenim curând 🙂')
}
document.getElementById('optClose').onclick = () => { menuFileDrop.hidden = true; endChatAndLeave() }

document.getElementById('nickToggle').onclick = () => nicklistEl.classList.toggle('nl-open')
document.getElementById('btnClose').onclick = endChatAndLeave

// Mobile browsers suspend a backgrounded tab and often tear down WebRTC while
// you're in another app. When the page comes back to the foreground, re-check
// the connection and surface the dialog instead of a frozen-looking chat.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !everConnected || !pc) return
  const s = pc.connectionState
  if (s === 'failed' || s === 'closed' || (dc && dc.readyState !== 'open')) {
    showConnectionLost()
  } else if (s === 'disconnected') {
    showGraceCountdown(15)
  }
})

// ---------------- boot ----------------

addLine('sys', 'Poiana lui Iocan — chat P2P direct, stil mIRC.')
addLine('sys', 'fără cont, fără server, fără istoric — doar voi doi.')

const initialCode = extractCode(location.hash.slice(1), 'o')
if (location.hash.includes('o=') && initialCode) {
  addLine('sys', '[*] ai un link de invitație — alege un nume ca să te alături:')
  askNameThen((name) => startJoin(initialCode, name))
} else {
  landing()
}
</script>
