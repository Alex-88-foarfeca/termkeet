<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Poiana lui Iocan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #12151a;
    --panel: #181d24;
    --panel-line: #232a33;
    --fg: #e7ece7;
    --dim: #7c8b96;
    --accent: #4fd68a;   /* self / primary */
    --accent2: #5fc3e0;  /* peer */
    --danger: #e2685c;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    justify-content: center;
    min-height: 100%;
  }

  .app {
    position: relative;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--panel-line);
    border-right: 1px solid var(--panel-line);
  }

  /* ---- disconnect overlay ---- */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: rgba(18, 21, 26, .94);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 28px;
    text-align: center;
    font-family: var(--mono);
  }
  .overlay .ov-title { font-size: 14px; color: var(--fg); letter-spacing: .02em; }
  .overlay .ov-count {
    font-size: 44px;
    font-weight: 600;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .overlay .ov-count.warn { color: var(--danger); }
  .overlay .ov-sub { font-size: 12.5px; color: var(--dim); line-height: 1.6; max-width: 280px; }
  .overlay .btn { max-width: 220px; }

  /* ---- title bar ---- */
  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--panel-line);
    flex: none;
  }

  /* thin notice: chat history is capped */
  .histhint {
    flex: none;
    padding: 5px 16px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--dim);
    text-align: center;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-line);
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--dim);
    flex: none;
    transition: background .2s;
  }
  .dot.live { background: var(--accent); box-shadow: 0 0 0 3px rgba(79,214,138,.15); }
  .dot.err { background: var(--danger); box-shadow: 0 0 0 3px rgba(226,104,92,.15); }
  .brand { font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: .01em; white-space: nowrap; flex: none; }
  .status {
    margin-left: auto;
    min-width: 0;
    font-size: 12px;
    color: var(--dim);
    font-family: var(--mono);
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- log ---- */
  .log {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.55;
  }
  .line { white-space: pre-wrap; word-break: break-word; margin-bottom: 2px; }
  .line.sys { color: var(--dim); }
  .line.err { color: var(--danger); }
  .line.hint { color: var(--dim); }

  /* ---- chat bubbles (WhatsApp-style: you right, peer left) ---- */
  /* Each .msg is a full-width block row; the bubble is an inline-block
     capped at 78% and aligned via text-align — this can never widen the
     page the way flex intrinsic sizing can. */
  .msg { margin: 4px 0; }
  .msg.self { text-align: right; }
  .msg .meta {
    font-size: 10.5px;
    color: var(--dim);
    margin: 0 5px 2px;
    font-family: var(--mono);
  }
  .msg .bubble {
    display: inline-block;
    max-width: 78%;
    padding: 7px 10px;
    border-radius: 11px;
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    text-align: left;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.self .bubble { background: var(--accent); color: #0b1a11; border-bottom-right-radius: 3px; }
  .msg.peer .bubble { background: #232a33; color: var(--fg); border-bottom-left-radius: 3px; }

  @keyframes blink { 50% { opacity: 0; } }

  /* Custom text caret: a blinking green block (like a terminal cursor)
     instead of the native "|". The input's real caret is made transparent;
     `.caret` is a filled rectangle positioned over the text by measuring
     `.caretmirror` (a hidden copy of the text before the caret, same font). */
  .caretwrap { position: relative; display: flex; flex: 1 1 auto; min-width: 0; }
  .caretwrap > input[type="text"] { flex: 1 1 auto; width: 100%; }
  .caretmirror {
    position: absolute; left: 0; top: 0;
    visibility: hidden; pointer-events: none;
    white-space: pre;
  }
  .caret {
    position: absolute;
    bottom: 15px;
    width: .6em;
    height: 1.05em;
    font-size: 16px;
    background: var(--accent);
    pointer-events: none;
    animation: blink 1s step-end infinite;
  }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; opacity: .7; } }

  /* ---- controls area ---- */
  .controls {
    flex: none;
    border-top: 1px solid var(--panel-line);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 13px 16px;
    cursor: pointer;
    text-align: center;
  }
  .btn:active { transform: translateY(1px); }
  .btn.secondary {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--panel-line);
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .btnrow { display: flex; gap: 8px; }
  .btnrow .btn { flex: 1; }

  label.field-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
  }
  input[type="text"] {
    font-family: var(--mono);
    font-size: 16px; /* >=16px avoids iOS zoom-on-focus */
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    caret-color: var(--accent);
  }
  input[type="text"]::placeholder { color: var(--dim); }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }

  /* ---- chat input row (replaces controls once connected) ---- */
  .chatrow {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chatrow .prompt { font-family: var(--mono); color: var(--accent); font-weight: 600; }
  .chatrow input[type="text"] { flex: 1; }
  .chatrow .send {
    font-family: var(--mono);
    font-weight: 600;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    height: 46px;
    cursor: pointer;
  }
  .chatrow .send:disabled { opacity: .4; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-line); border-radius: 4px; }
</style>
</head>
<body>
  <div class="app">
    <div class="titlebar">
      <div class="dot" id="dot"></div>
      <div class="brand">Poiana lui Iocan</div>
      <div class="status" id="status">neconectat</div>
    </div>
    <div class="histhint" id="histhint" hidden>se păstrează doar ultimele 20 de mesaje</div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="controls" id="controls"></div>
    <div class="overlay" id="overlay" style="display:none"></div>
  </div>

<script>
'use strict'

/*
 * Poiana lui Iocan — web (WebRTC) variant.
 *
 * Same idea as the desktop app: a private, minimal, P2P chat between two
 * people, no accounts, no chat history kept anywhere. This variant runs in
 * any phone/desktop browser instead of Electron, so it uses WebRTC's
 * RTCDataChannel for the actual P2P connection (encrypted end-to-end via
 * DTLS, same guarantee as Hyperswarm's Noise channels in the desktop app).
 *
 * WebRTC still needs a one-time handshake (an SDP "offer" and "answer")
 * exchanged before two peers can talk directly — that's what a signaling
 * server normally does. This page has no server or backend of any kind, on
 * purpose: the handshake is exchanged as a link/code the two people send
 * each other over whatever channel they like (WhatsApp, SMS, in person).
 * Once connected, every message goes directly between the two browsers.
 */

const log = document.getElementById('log')
const controls = document.getElementById('controls')
const dot = document.getElementById('dot')
const statusEl = document.getElementById('status')
const overlayEl = document.getElementById('overlay')
const histHintEl = document.getElementById('histhint')

const ICE_SERVERS = [
  {
    urls: [
      'stun:stun.l.google.com:19302',
      'stun:stun1.l.google.com:19302',
      'stun:stun.cloudflare.com:3478'
    ]
  },
  // Public test TURN relay (Open Relay Project / metered.ca) — only used as a
  // fallback when a direct path isn't reachable (e.g. strict carrier NATs). It
  // only ever sees encrypted bytes: TURN relays packets, it is not part of the
  // DTLS handshake and cannot read message content. These are shared public
  // credentials on a free tier; if a cellular-network test can't connect, the
  // relay is likely rate-limited — get a personal key at metered.ca (free,
  // 20GB/mo) and drop it in here.
  {
    urls: [
      'turn:staticauth.openrelay.metered.ca:80',
      'turn:staticauth.openrelay.metered.ca:443',
      'turn:staticauth.openrelay.metered.ca:443?transport=tcp'
    ],
    username: 'openrelayproject',
    credential: 'openrelayproject'
  }
]

let pc = null
let dc = null
let myName = 'anon'
let peerName = 'peer'
let keepaliveTimer = null
let overlayTimer = null
let everConnected = false // true once the DataChannel has opened at least once

// ---------------- log helpers ----------------

function timestamp () {
  return new Date().toTimeString().slice(0, 5)
}

function addLine (cls, text) {
  const div = document.createElement('div')
  div.className = 'line ' + cls
  div.textContent = text
  log.appendChild(div)
  log.scrollTop = log.scrollHeight
}

const MAX_HISTORY = 20 // keep only the last N chat bubbles on screen

function addChat (name, text, self) {
  const msg = document.createElement('div')
  msg.className = 'msg ' + (self ? 'self' : 'peer')

  const meta = document.createElement('div')
  meta.className = 'meta'
  meta.textContent = self ? timestamp() : (name + ' · ' + timestamp())

  const bubble = document.createElement('div')
  bubble.className = 'bubble'
  bubble.textContent = text

  msg.append(meta, bubble)
  log.appendChild(msg)

  const bubbles = log.querySelectorAll('.msg')
  for (let i = 0; i < bubbles.length - MAX_HISTORY; i++) bubbles[i].remove()

  log.scrollTop = log.scrollHeight
}

function setStatus (text, kind) {
  statusEl.textContent = text
  dot.className = 'dot' + (kind ? ' ' + kind : '')
}

// ---------------- block caret ----------------

// Swap a text input's native "|" caret for a blinking green block (terminal
// style). Call it after the input is in the DOM. Works for any font by
// measuring a hidden mirror of the text up to the caret; tracks selection
// and horizontal scroll.
function blockCaret (input) {
  input.style.caretColor = 'transparent'

  const wrap = document.createElement('span')
  wrap.className = 'caretwrap'
  input.replaceWith(wrap)
  wrap.appendChild(input)

  const mirror = document.createElement('span')
  mirror.className = 'caretmirror'
  const caret = document.createElement('span')
  caret.className = 'caret'
  wrap.append(mirror, caret)

  function sync () {
    const cs = getComputedStyle(input)
    mirror.style.fontFamily = cs.fontFamily
    mirror.style.fontSize = cs.fontSize
    mirror.style.fontWeight = cs.fontWeight
    mirror.style.fontStyle = cs.fontStyle
    mirror.style.letterSpacing = cs.letterSpacing
    const pos = input.selectionStart == null ? input.value.length : input.selectionStart
    mirror.textContent = input.value.slice(0, pos)
    const padL = parseFloat(cs.paddingLeft) || 0
    const padR = parseFloat(cs.paddingRight) || 0
    const x = padL + mirror.offsetWidth - input.scrollLeft
    caret.style.left = Math.max(padL, Math.min(x, input.clientWidth - padR - 2)) + 'px'
    caret.style.display = (document.activeElement === input) ? 'block' : 'none'
  }

  const onEvt = () => requestAnimationFrame(sync)
  ;['input', 'keyup', 'keydown', 'click', 'focus', 'blur', 'scroll'].forEach(
    (ev) => input.addEventListener(ev, onEvt)
  )
  input._syncCaret = sync // let callers refresh after programmatic value changes
  requestAnimationFrame(sync)
}

// ---------------- disconnect overlay ----------------

function hideOverlay () {
  if (overlayTimer) { clearInterval(overlayTimer); overlayTimer = null }
  overlayEl.style.display = 'none'
  overlayEl.innerHTML = ''
}

// Counts down the grace window during a `disconnected` blip. If the link
// comes back, hideOverlay() is called and this never expires. If it hits
// zero, the connection is treated as gone.
function showGraceCountdown (seconds) {
  if (overlayTimer) clearInterval(overlayTimer)
  let left = seconds
  overlayEl.style.display = 'flex'
  overlayEl.innerHTML =
    '<div class="ov-title">conexiune instabilă</div>' +
    '<div class="ov-count" id="ovCount">' + left + '</div>' +
    '<div class="ov-sub">încerc să reiau legătura automat.<br>' +
    'dacă ajunge la 0, creați o cameră nouă ca să continuați.</div>'
  const countEl = document.getElementById('ovCount')
  overlayTimer = setInterval(() => {
    left--
    if (countEl) {
      countEl.textContent = left
      if (left <= 10) countEl.classList.add('warn')
    }
    if (left <= 0) {
      clearInterval(overlayTimer)
      overlayTimer = null
      showConnectionLost()
    }
  }, 1000)
}

function showConnectionLost () {
  if (overlayTimer) { clearInterval(overlayTimer); overlayTimer = null }
  stopKeepalive()
  overlayEl.style.display = 'flex'
  overlayEl.innerHTML = ''
  const title = document.createElement('div')
  title.className = 'ov-title'
  title.textContent = 'conexiune pierdută'
  const sub = document.createElement('div')
  sub.className = 'ov-sub'
  sub.textContent = 'legătura cu ' + peerName + ' s-a încheiat. creați o cameră nouă ca să continuați conversația.'
  const btn = document.createElement('button')
  btn.className = 'btn'
  btn.textContent = 'Cameră nouă'
  btn.onclick = () => { location.href = location.origin + location.pathname }
  overlayEl.append(title, sub, btn)
  setStatus('deconectat', 'err')
}

// ---------------- SDP <-> short code ----------------

function toBase64Url (buf) {
  let bin = ''
  const bytes = new Uint8Array(buf)
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i])
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
}

function fromBase64Url (str) {
  const b64 = str.replace(/-/g, '+').replace(/_/g, '/').padEnd(str.length + (4 - str.length % 4) % 4, '=')
  const bin = atob(b64)
  const bytes = new Uint8Array(bin.length)
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
  return bytes.buffer
}

async function packSDP (desc) {
  const json = JSON.stringify({ t: desc.type, s: desc.sdp, n: myName })
  if (typeof CompressionStream === 'function') {
    const cs = new CompressionStream('gzip')
    const writer = cs.writable.getWriter()
    writer.write(new TextEncoder().encode(json))
    writer.close()
    const buf = await new Response(cs.readable).arrayBuffer()
    return 'z' + toBase64Url(buf)
  }
  return 'p' + toBase64Url(new TextEncoder().encode(json).buffer)
}

async function unpackSDP (code) {
  const kind = code[0]
  const buf = fromBase64Url(code.slice(1))
  let json
  if (kind === 'z') {
    const ds = new DecompressionStream('gzip')
    const writer = ds.writable.getWriter()
    writer.write(new Uint8Array(buf))
    writer.close()
    const out = await new Response(ds.readable).arrayBuffer()
    json = new TextDecoder().decode(out)
  } else {
    json = new TextDecoder().decode(buf)
  }
  const obj = JSON.parse(json)
  return { desc: { type: obj.t, sdp: obj.s }, name: (obj.n || 'peer').slice(0, 40) }
}

// Accept either a raw code or a full shared link containing it.
function extractCode (input, param) {
  const trimmed = input.trim()
  const hashIdx = trimmed.indexOf('#')
  const hash = hashIdx >= 0 ? trimmed.slice(hashIdx + 1) : trimmed
  const params = new URLSearchParams(hash)
  return params.get(param) || trimmed
}

function shareLink (param, code) {
  return location.origin + location.pathname + '#' + param + '=' + code
}

// ---------------- WebRTC plumbing ----------------

function waitIceComplete (peerConn) {
  if (peerConn.iceGatheringState === 'complete') return Promise.resolve()
  return new Promise((resolve) => {
    const done = () => {
      peerConn.removeEventListener('icegatheringstatechange', check)
      clearTimeout(timer)
      resolve()
    }
    const check = () => { if (peerConn.iceGatheringState === 'complete') done() }
    peerConn.addEventListener('icegatheringstatechange', check)
    const timer = setTimeout(done, 8000) // proceed with whatever we have
  })
}

// Keepalive: WebRTC's own ICE consent checks keep the transport alive in
// theory, but on mobile data / strict NATs an *idle* DataChannel path still
// gets its NAT mapping dropped after ~30-60s — which is why the chat used to
// "die" if you didn't type for a bit. A tiny ping every 15s keeps the path
// warm. These frames carry a `t` field and are filtered out before the chat
// renderer ever sees them.
function stopKeepalive () {
  if (keepaliveTimer) { clearInterval(keepaliveTimer); keepaliveTimer = null }
}

function startKeepalive () {
  stopKeepalive()
  keepaliveTimer = setInterval(() => {
    if (dc && dc.readyState === 'open') {
      try { dc.send(JSON.stringify({ t: 'ping' })) } catch (_) {}
    }
  }, 15000)
}

// Any failure anywhere in the connect flow — a thrown error, a rejected
// promise, or a step that just never settles (a browser silently refusing
// WebRTC, for instance) — must end up VISIBLE, never a silent freeze on
// "se pregătește...". showFatal renders it; withWatchdog races a step
// against a timeout so even a hang that throws nothing still surfaces.
function showFatal (err) {
  const detail = (err && (err.message || err.name)) || String(err)
  addLine('err', '[!] ' + detail)
  addLine('hint', '    reîncarcă pagina și încearcă din nou.')
  setStatus('eroare', 'err')
  console.error(err)
}

function withWatchdog (label, promise, ms) {
  let timer
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(label + ' durează prea mult — browserul ar putea bloca WebRTC aici.')), ms)
  })
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer))
}

window.addEventListener('unhandledrejection', (e) => { showFatal(e.reason) })

function createPeerConnection () {
  if (typeof RTCPeerConnection !== 'function') {
    throw new Error('acest browser nu suportă WebRTC (RTCPeerConnection lipsește).')
  }
  const conn = new RTCPeerConnection({ iceServers: ICE_SERVERS })

  // `disconnected` is almost always transient (a network blip, a phone
  // switching towers/wifi). Only `failed` is terminal. On `disconnected` we
  // show the countdown overlay and wait it out; if the link recovers the
  // overlay is dismissed, if the countdown expires it's treated as lost.
  const GRACE_SECONDS = 15

  conn.onconnectionstatechange = () => {
    const s = conn.connectionState
    if (s === 'connected') {
      hideOverlay()
      if (dc && dc.readyState === 'open') setStatus('conectat cu ' + peerName, 'live')
    } else if (s === 'disconnected') {
      if (!everConnected) return
      setStatus('conexiune instabilă…', 'err')
      showGraceCountdown(GRACE_SECONDS)
    } else if (s === 'failed') {
      stopKeepalive()
      if (everConnected) {
        showConnectionLost()
      } else {
        addLine('err', '[!] nu s-a putut stabili conexiunea — reîncărcați pagina și încercați din nou.')
        setStatus('eroare', 'err')
      }
    }
  }
  return conn
}

function wireDataChannel (channel) {
  dc = channel
  dc.onopen = () => {
    everConnected = true
    hideOverlay()
    setStatus('conectat cu ' + peerName, 'live')
    addLine('sys', '[*] conexiune P2P deschisă — mesajele merg direct între voi, criptat.')
    startKeepalive()
    renderChat()
  }
  dc.onclose = () => {
    stopKeepalive()
    addLine('sys', '[*] conversația s-a încheiat (' + peerName + ' a plecat).')
    if (everConnected) showConnectionLost()
    else setStatus('deconectat', 'err')
  }
  dc.onmessage = (e) => {
    let msg
    try { msg = JSON.parse(e.data) } catch (_) { return /* ignore malformed frames */ }
    if (msg && (msg.t === 'ping' || msg.t === 'pong')) {
      if (msg.t === 'ping' && dc.readyState === 'open') {
        try { dc.send(JSON.stringify({ t: 'pong' })) } catch (_) {}
      }
      return
    }
    addChat(String(msg.name || peerName).slice(0, 40), String(msg.text || '').slice(0, 4000), false)
  }
}

// ---------------- flows ----------------

function clearControls () { controls.innerHTML = '' }

function landing () {
  clearControls()
  const create = document.createElement('button')
  create.className = 'btn'
  create.textContent = 'Creează o cameră nouă'
  create.onclick = () => askNameThen(startCreate)

  const or = document.createElement('div')
  or.className = 'field-label'
  or.style.textAlign = 'center'
  or.textContent = 'sau'

  const joinInput = document.createElement('input')
  joinInput.type = 'text'
  joinInput.placeholder = 'lipește aici linkul / codul primit'
  joinInput.autocomplete = 'off'
  joinInput.autocapitalize = 'off'

  const join = document.createElement('button')
  join.className = 'btn secondary'
  join.textContent = 'Alătură-te'
  join.onclick = () => {
    const code = extractCode(joinInput.value, 'o')
    if (!code) return
    askNameThen((name) => startJoin(code, name))
  }

  controls.append(create, or, joinInput, join)
  blockCaret(joinInput)
}

function askNameThen (next) {
  clearControls()
  const label = document.createElement('div')
  label.className = 'field-label'
  label.textContent = 'numele tău (îl vede celălalt)'
  const input = document.createElement('input')
  input.type = 'text'
  input.placeholder = 'ex: Alex'
  input.maxLength = 40
  input.autocomplete = 'off'
  const go = document.createElement('button')
  go.className = 'btn'
  go.textContent = 'Continuă'
  go.onclick = () => {
    myName = (input.value.trim() || 'anon').slice(0, 40)
    Promise.resolve(next(myName)).catch(showFatal)
  }
  controls.append(label, input, go)
  blockCaret(input)
  input.focus()
}

async function startCreate () {
  clearControls()
  addLine('sys', '[*] pregătesc camera...')
  setStatus('se pregătește...')

  const link = await withWatchdog('crearea camerei', (async () => {
    pc = createPeerConnection()
    const channel = pc.createDataChannel('chat')
    wireDataChannel(channel)

    const offer = await pc.createOffer()
    await pc.setLocalDescription(offer)
    await waitIceComplete(pc)

    const code = await packSDP(pc.localDescription)
    return shareLink('o', code)
  })(), 20000)

  addLine('sys', '[*] cameră creată. trimite link-ul de mai jos prietenului tău:')
  renderShare(link, 'Trimite invitația', async () => {
    clearControls()
    const label = document.createElement('div')
    label.className = 'field-label'
    label.textContent = 'după ce prietenul tău îți trimite înapoi codul lui de răspuns, lipește-l aici:'
    const input = document.createElement('input')
    input.type = 'text'
    input.placeholder = 'cod de răspuns'
    input.autocomplete = 'off'
    input.autocapitalize = 'off'
    const go = document.createElement('button')
    go.className = 'btn'
    go.textContent = 'Conectează'
    go.onclick = async () => {
      const answerCode = extractCode(input.value, 'a')
      if (!answerCode) return
      go.disabled = true
      try {
        const { desc, name } = await unpackSDP(answerCode)
        peerName = name
        await pc.setRemoteDescription(desc)
        addLine('sys', '[*] se stabilește conexiunea directă...')
        setStatus('se conectează...')
      } catch (err) {
        addLine('err', '[!] cod invalid: ' + ((err && err.message) || err))
        go.disabled = false
      }
    }
    controls.append(label, input, go)
    blockCaret(input)
  }, link)
}

async function startJoin (offerCode, name) {
  clearControls()
  addLine('sys', '[*] mă alătur camerei...')
  setStatus('se pregătește...')
  myName = name

  let offer
  try {
    offer = await unpackSDP(offerCode)
  } catch (err) {
    addLine('err', '[!] linkul/codul nu e valid.')
    landing()
    return
  }
  peerName = offer.name

  const code = await withWatchdog('conectarea la cameră', (async () => {
    pc = createPeerConnection()
    pc.ondatachannel = (e) => wireDataChannel(e.channel)

    await pc.setRemoteDescription(offer.desc)
    const answer = await pc.createAnswer()
    await pc.setLocalDescription(answer)
    await waitIceComplete(pc)

    return packSDP(pc.localDescription)
  })(), 20000)

  addLine('sys', '[*] trimite codul de mai jos înapoi lui ' + peerName + ' ca să terminați conectarea:')
  renderShare(null, 'Trimite codul de răspuns', null, code, 'Poiana lui Iocan — cod de răspuns:\n' + code + '\n\n(lipește-l în ecranul unde a fost creată camera)')
  addLine('hint', '    aștept ca ' + peerName + ' să finalizeze conectarea...')
  setStatus('în așteptare...')
}

// Renders a share/copy widget. If `link` is given, share/copy a full link;
// otherwise share/copy the raw `rawCode` (used for the answer step, where
// the recipient must paste it back rather than open it as a page).
function renderShare (link, shareLabel, onManualNext, rawForCopy, shareTextOverride) {
  const box = document.createElement('input')
  box.type = 'text'
  box.readOnly = true
  box.value = link || rawForCopy
  box.onclick = () => box.select()

  const row = document.createElement('div')
  row.className = 'btnrow'

  const copyBtn = document.createElement('button')
  copyBtn.className = 'btn secondary'
  copyBtn.textContent = 'Copiază'
  copyBtn.onclick = async () => {
    const text = link || rawForCopy
    try {
      await navigator.clipboard.writeText(text)
      copyBtn.textContent = 'Copiat ✓'
      setTimeout(() => { copyBtn.textContent = 'Copiază' }, 1500)
    } catch (_) {
      box.select()
      document.execCommand('copy')
    }
  }

  const shareBtn = document.createElement('button')
  shareBtn.className = 'btn'
  shareBtn.textContent = shareLabel
  shareBtn.onclick = async () => {
    const text = shareTextOverride || ('Poiana lui Iocan — invitație la chat: ' + link)
    try {
      if (navigator.share) {
        await navigator.share(link ? { title: 'Poiana lui Iocan', text: 'Poiana lui Iocan — invitație la chat', url: link } : { title: 'Poiana lui Iocan', text })
      } else {
        await navigator.clipboard.writeText(text)
        shareBtn.textContent = 'Copiat ✓ (lipește-l în orice app)'
        setTimeout(() => { shareBtn.textContent = shareLabel }, 2000)
      }
    } catch (_) { /* user cancelled share sheet — fine */ }
  }

  row.append(shareBtn, copyBtn)
  controls.append(box, row)

  if (onManualNext) {
    const nextBtn = document.createElement('button')
    nextBtn.className = 'btn secondary'
    nextBtn.textContent = 'Am trimis-o →'
    nextBtn.onclick = onManualNext
    controls.append(nextBtn)
  }
}

function renderChat () {
  clearControls()
  histHintEl.textContent = 'se păstrează doar ultimele ' + MAX_HISTORY + ' de mesaje'
  histHintEl.hidden = false
  const row = document.createElement('div')
  row.className = 'chatrow'

  const prompt = document.createElement('span')
  prompt.className = 'prompt'
  prompt.textContent = '>'

  const input = document.createElement('input')
  input.type = 'text'
  input.placeholder = 'scrie un mesaj...'
  input.autocomplete = 'off'
  input.maxLength = 2000

  const send = document.createElement('button')
  send.className = 'send'
  send.textContent = 'Trimite'

  function submit () {
    const text = input.value.trim()
    if (!text || !dc || dc.readyState !== 'open') return
    dc.send(JSON.stringify({ name: myName, text }))
    addChat(myName, text, true)
    input.value = ''
    if (input._syncCaret) input._syncCaret()
  }

  send.onclick = submit
  input.onkeydown = (e) => { if (e.key === 'Enter') submit() }

  row.append(prompt, input, send)
  controls.appendChild(row)
  blockCaret(input)
  input.focus()
}

// Mobile browsers suspend a backgrounded tab and often tear down WebRTC while
// you're in another app. When the page comes back to the foreground, re-check
// the connection and surface the overlay instead of a frozen-looking chat.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !everConnected || !pc) return
  const s = pc.connectionState
  if (s === 'failed' || s === 'closed' || (dc && dc.readyState !== 'open')) {
    showConnectionLost()
  } else if (s === 'disconnected') {
    showGraceCountdown(15)
  }
})

// ---------------- boot ----------------

addLine('sys', 'Poiana lui Iocan — chat P2P direct între două telefoane.')
addLine('sys', 'fără cont, fără server, fără istoric — doar voi doi.')

const initialCode = extractCode(location.hash.slice(1), 'o')
if (location.hash.includes('o=') && initialCode) {
  addLine('sys', '[*] ai un link de invitație — alege un nume ca să te alături:')
  askNameThen((name) => startJoin(initialCode, name))
} else {
  landing()
}
